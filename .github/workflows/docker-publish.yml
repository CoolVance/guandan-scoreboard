name: Docker Publish

on:
  release:
    types: [published] # 当发布新 Release 时触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # 用于支持多平台构建 (如 arm64)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64 # 构建 amd64
          push: true
          tags: |
            coolvance/guandan-scoreboard:latest
            coolvance/guandan-scoreboard:${{ github.event.release.tag_name }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: coolvance/guandan-scoreboard
          short-description: "掼蛋记分板 - 现代化移动端优先计分工具 / Modern mobile-first scoreboard for Guandan."
          readme-filepath: ./README.md
