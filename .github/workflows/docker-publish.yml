name: Docker Publish

on:
  release:
    types: [published] # 当发布新 Release 时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # 用于支持多平台构建 (如 arm64)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # 同时构建 amd64 和 arm64 镜像 (支持 NAS/树莓派)
          push: true
          tags: |
            coolvance/guandan-scoreboard:latest
            coolvance/guandan-scoreboard:${{ github.event.release.tag_name }}
