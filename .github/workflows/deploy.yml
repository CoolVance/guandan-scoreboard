name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # 推送到 main 时触发

permissions:
  contents: write # 部署到 gh-pages 分支需要权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 编译后的产物所在目录
          branch: gh-pages # 目标分支
