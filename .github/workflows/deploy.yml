name: Deploy and Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- Docker 多平台构建支持 ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker Images
        run: |
          mkdir -p releases
          VERSION=$(node -p "require('./package.json').version")
          IMAGE_NAME=$(node -p "require('./package.json').name")
          
          # 定义要构建的平台
          PLATFORMS=("linux/amd64" "linux/arm64" "linux/386" "linux/arm/v7")
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            # 格式化平台名称用于文件名 (如 linux/amd64 -> linux-amd64)
            PLATFORM_TAG=$(echo $PLATFORM | sed 's/\//-/g')
            FILE_NAME="${IMAGE_NAME}-${VERSION}-${PLATFORM_TAG}.tar"
            
            echo "Building for $PLATFORM..."
            
            # 构建镜像并导出为本地 tar 文件
            # --load 将镜像加载到本地 docker 环境，但多平台构建通常不支持 --load
            # 因此我们使用 --output 来直接输出为本地文件
            docker buildx build \
              --platform $PLATFORM \
              --tag "${IMAGE_NAME}:${VERSION}" \
              --output type=docker,dest="releases/${FILE_NAME}" \
              .
          done
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Release v${{ env.VERSION }} (Docker Images)
          draft: false
          prerelease: false
          files: |
            releases/*.tar
          body: |
            Automatically generated release with Docker images.
            To use these images, download the .tar file and run:
            `docker load -i guandan-scoreboard-xxx.tar`
            
            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
