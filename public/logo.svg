<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 红色渐变 -->
    <linearGradient id="redGrad" x1="256" y1="50" x2="256" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ee4444" />
    </linearGradient>
    <!-- 蓝色渐变 -->
    <linearGradient id="blueGrad" x1="50" y1="256" x2="180" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#60a5fa" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <!-- 中心黄色渐变 -->
    <linearGradient id="centerGrad" x1="256" y1="180" x2="256" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#fcd34d" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
    <!-- 软阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景底色 (轻微圆角卡片感) -->
  <rect width="512" height="512" rx="96" fill="#f8fafc" />

  <!-- 十十字架结构 (圆润卡通版) -->
  <g filter="url(#softShadow)">
    <!-- 北 (红) -->
    <rect x="180" y="50" width="152" height="152" rx="40" fill="#ef4444" />
    <!-- 南 (红) -->
    <rect x="180" y="310" width="152" height="152" rx="40" fill="#ef4444" />
    <!-- 西 (蓝) -->
    <rect x="50" y="180" width="152" height="152" rx="40" fill="#3b82f6" />
    <!-- 东 (蓝) -->
    <rect x="310" y="180" width="152" height="152" rx="40" fill="#3b82f6" />
  </g>

  <!-- 中心核心块 -->
  <g filter="url(#softShadow)">
    <rect x="164" y="164" width="184" height="184" rx="45" fill="url(#centerGrad)" stroke="white" stroke-width="6" />
    <!-- 中心数字 2 -->
    <text x="256" y="305" text-anchor="middle" fill="white" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-weight="900" font-size="160" style="filter: drop-shadow(0 6px 2px rgba(0,0,0,0.1))">2</text>
  </g>
</svg>
